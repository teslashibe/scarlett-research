name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: go test ./...
        working-directory: kernel
      - run: scarlett-research demo --output runs/demo
      - run: scarlett-research loop --snapshot runs/demo/snapshot.json --output runs/search
